      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-CONFIGURAR_API_KEY_EN_ENV}
    depends_on:
      - db
    networks:
      - gevopi-net
  nginx:
    image: nginx:latest
    container_name: gevopi
    expose:
      - "80"
    # ports:
    #   - "8080:80" #---> despliegue local con puerto 8080
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - gevopi-net
      - internal-network
      - proxy-network
  db:
    image: postgres:latest
    container_name: gevopi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gevopi_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - gevopi-net

networks:
  gevopi-net:
    driver: bridge
  internal-network:
    external: true
  proxy-network:
    external: true

volumes:
  db-data: