      - db
    networks:
      - gevopi-net
  nginx:
    image: nginx:latest
    container_name: gevopi
    expose:
      - "80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - gevopi-net
      - internal-network
      - proxy-network
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gevopi-reverb
    entrypoint: []
    command: ["sh", "-c", "cd /var/www && php artisan reverb:start --host=0.0.0.0 --port=8080"]
    ports:
      - "8085:8080"
    volumes:
      - .:/var/www
    environment:
      APP_NAME: GEVOPI
      APP_ENV: production
      APP_KEY: base64:KmtIWWc4RjhUdWRoSGtqMnBXNTZoQ0x2YjVQeXJZMnM=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: gevopi_db
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: 885889
      REVERB_APP_KEY: ljtplxexpbq7atbjzrzp
      REVERB_APP_SECRET: yy9plhe0c7ffjltaidfh
      REVERB_HOST: gevopi.dasalas.shop
      REVERB_PORT: 8085
      REVERB_SCHEME: http
    depends_on:
      - db
      - laravel
    networks:
      - gevopi-net
  db:
    image: postgres:latest
    container_name: gevopi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gevopi_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - gevopi-net

networks:
  gevopi-net:
    driver: bridge
  internal-network:
    external: true
  proxy-network:
    external: true

volumes:
  db-data: